spring.application.name=payment-service
server.port=8084

spring.datasource.url=jdbc:h2:mem:paymentdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info

# OpenAPI JSON: /v3/api-docs; interactive Swagger UI: /swagger-ui.html

# Fare formula: base + (distance in km * per-km rate) + (duration in minutes * per-minute rate).
# Each component is rounded to two decimal places (HALF_UP); payment amounts come from this calculation.
# A receipt is persisted when a simulated payment transitions from PENDING to SUCCESS.
payment.fare.base=2.00
payment.fare.per-km=1.50
payment.fare.per-minute=0.25
