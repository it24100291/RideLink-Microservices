spring.application.name=ridelink-ride-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:ridedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

driver.service.base-url=${DRIVER_SERVICE_URL:http://localhost:8081}
payment.service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8084}
payment.service.key=${PAYMENT_SERVICE_KEY:}
account.service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8083}
integration.account-service-key=${ACCOUNT_SERVICE_KEY:}
integration.ride-service-key=${RIDE_SERVICE_KEY:}
spring.jpa.open-in-view=false
